<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Event</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/vargani.css') }}">


<style>
      
      nav{
            padding: 0px 25px;
          }
        .logo img {
          height: 70px;
          width: auto;
        }
        </style>
      </head>
      <body>
        <div class="background-blur">
          <div class="color-overlay"></div>
        </div>
        <nav>
          <div class="logo">
            <img src="/static/images/logo.png" alt="Logo" />
          </div>
          <div class="hamburger" onclick="toggleMenu()">☰</div>
          <div class="nav-links" id="navLinks">
            <a href="/">Home</a>
            <a href="/vargani">Vargani</a>
            <a href="/expense">Expense</a>
            <a href="/galleryview">Gallery</a>
            <a href="/dashboard">Dashboard</a>
          </div>
        </nav>
<div class="container mt-5">
    <h2 class="mb-4 text-center">Select Event to View Registrations</h2>

    <div class="card shadow p-4">
        <label for="event">Choose Event:</label>
        <select id="event" class="form-select" onchange="if(this.value) window.location='/event_registrations/' + this.value;">
            <option value="">-- Select Event --</option>
            {% for event in events %}
                <option value="{{ event._id }}">{{ event.title }}</option>
            {% endfor %}
        </select>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleMenu() {
      const links = document.getElementById('navLinks');
      links.classList.toggle('active');
    }
  </script>
</body>
</html>
