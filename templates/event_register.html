<!DOCTYPE html>
<html>
<head>
  <title>Event Registration</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/events.css') }}">
</head>
<body>
  <div class="container">
    <h2>Register for {{ event.title }}</h2>

    <form method="POST" enctype="multipart/form-data">
      {% if event.is_paid %}
        <p>📲 Please scan the QR code below and make the payment:</p>
        <img src="{{ event.qr_url }}" alt="QR Code" style="max-width:200px;"><br>
        {% if event.upi_id %}
          <p>UPI ID: <b>{{ event.upi_id }}</b></p>
        {% endif %}
        <input type="text" name="payment_id" placeholder="Payment Transaction ID" required><br><br>
        <label>Upload Payment Screenshot:</label><br>
        <input type="file" name="payment_ss" accept="image/*" required><br><br>
      {% endif %}

      <input type="text" name="name" placeholder="Full Name" required><br><br>
      <input type="text" name="address" placeholder="Address" required><br><br>
      <input type="text" name="mobile" placeholder="Mobile Number" required><br><br>

      <button type="submit">Submit Registration</button>
    </form>
  </div>
</body>
</html>
